[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handsfree"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0",
  "pytest>=9.0.0",
]

[project.optional-dependencies]
hud = ["PySide6>=6.6"]

[project.scripts]
usage-hud = "model_usage_hud.cli:main"
handsfree-hud = "model_usage_hud.app.main:main"

[tool.setuptools]
py-modules = ["usage_hud"]

[tool.setuptools.packages.find]
include = ["model_usage_hud*"]

[tool.setuptools.package-data]
"model_usage_hud.app" = [
  "assets/providers/*.svg",
  "assets/providers/LICENSE-*",
  "assets/icons/*.svg",
  "assets/icons/LICENSE-*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
